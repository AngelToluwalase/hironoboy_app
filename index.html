<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hirono Boy Collector</title>
<meta name="description" content="Open blind boxes, unlock Hirono boy figurines and browse your collection.">
<meta name="theme-color" content="#16382a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <!-- hand-drawn star field, generated by app.js -->
  <svg class="stars" id="stars" aria-hidden="true"></svg>

  <header class="topbar">
    <nav class="nav">
      <button data-go="home" class="active">Home</button>
      <button data-go="box">Blind Box</button>
      <button data-go="shelf">My Shelf</button>
      <button data-go="series">Series</button>
    </nav>
    <div class="top-right">
      <span class="dust" title="Stardust: tap floating stars to earn more">✦ <b id="dust">0</b></span>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle light / dark mode">
        <span class="sun">☀</span><span class="moon">☾</span>
      </button>
    </div>
  </header>

  <!-- The explorable world: four screens laid out on a 2x2 map -->
  <main class="viewport" id="viewport">
    <div class="world" id="world">

      <section class="screen" data-screen="home" style="--x:0;--y:0">
        <p class="kicker">a tiny collectors' game</p>
        <h1 class="title">Hir<span class="o">o</span>no</h1>
        <p class="sub serif">Lonely little boys, softly collected —<br>one blind box at a time.</p>
        <div class="carousel" id="carousel" aria-label="Featured figurines — swipe or use arrows">
          <div class="track" id="track"></div>
        </div>
        <div class="car-ctrl">
          <button class="pill ghost" id="prevFig" aria-label="Previous">←</button>
          <span class="car-name" id="carName"></span>
          <button class="pill ghost" id="nextFig" aria-label="Next">→</button>
        </div>
        <button class="pill cta" data-go="box">Open a blind box ✦</button>
      </section>

      <section class="screen" data-screen="box" style="--x:1;--y:0">
        <p class="kicker">the blind box counter</p>
        <h2 class="h2">Shake. Open. <em class="serif">Meet him.</em></h2>
        <div class="box-stage">
          <button class="blindbox" id="blindbox" aria-label="Open blind box">
            <span class="lid"></span><span class="body"><span class="q">?</span></span>
          </button>
          <div class="reveal" id="reveal"></div>
        </div>
        <p class="hint" id="boxHint">Costs 10 ✦ · you get 1 free box to start</p>
        <div class="series-pick" id="seriesPick"></div>
      </section>

      <section class="screen" data-screen="shelf" style="--x:0;--y:1">
        <p class="kicker">your collection</p>
        <h2 class="h2">My Shelf <span class="count" id="shelfCount"></span></h2>
        <div class="filters" id="filters"></div>
        <div class="shelf" id="shelf"></div>
      </section>

      <section class="screen" data-screen="series" style="--x:1;--y:1">
        <p class="kicker">the series</p>
        <h2 class="h2">Little worlds <em class="serif">to wander</em></h2>
        <div class="series-list" id="seriesList"></div>
      </section>
    </div>
  </main>

  <!-- edge arrows for exploring the map -->
  <button class="edge up" data-dir="up" aria-label="Go up">↑</button>
  <button class="edge down" data-dir="down" aria-label="Go down">↓</button>
  <button class="edge left" data-dir="left" aria-label="Go left">←</button>
  <button class="edge right" data-dir="right" aria-label="Go right">→</button>

  <div class="minimap" id="minimap" aria-label="Map">
    <button data-go="home" title="Home"></button><button data-go="box" title="Blind Box"></button>
    <button data-go="shelf" title="My Shelf"></button><button data-go="series" title="Series"></button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" id="modalCard"></div>
</div>
<div class="toast" id="toast"></div>

<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
